# SolarStoragePro Nginx 反向代理配置
# 位置: C:\nginx\conf\nginx.conf (替换默认配置)
# 用途: 80/443 → 127.0.0.1:3100 (Next.js standalone)

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 80 端口：HTTP（备案通过前用 IP 直接访问测试）
    server {
        listen       80;
        server_name  solarstoragepro.com www.solarstoragepro.com 8.155.40.233;

        client_max_body_size 20m;

        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }

        # 静态资源直接由 Nginx 缓存（可选优化）
        location /_next/static/ {
            proxy_pass http://127.0.0.1:3100;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /public/ {
            proxy_pass http://127.0.0.1:3100;
            expires 30d;
        }
    }

    # 443 端口：HTTPS（备案通过 + SSL 证书后启用）
    # server {
    #     listen       443 ssl;
    #     server_name  solarstoragepro.com www.solarstoragepro.com;
    #
    #     ssl_certificate      C:\cert\fullchain.pem;
    #     ssl_certificate_key  C:\cert\privkey.pem;
    #     ssl_protocols        TLSv1.2 TLSv1.3;
    #     ssl_ciphers          HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass http://127.0.0.1:3100;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 120s;
    #     }
    # }
}
